 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaceIQ</title>
<style>
*{box-sizing:border-box}
body{background:#0b1220;color:#eef2ff;font-family:system-ui;margin:0;padding:20px}
main{max-width:900px;margin:auto}
h1{color:#4ade80;font-size:36px;margin-bottom:0}
p{color:#a5b4cc}
.panel{background:#162033;border:1px solid #334155;border-radius:14px;padding:18px;margin:16px 0}
label{display:block;margin:12px 0 6px;font-weight:600}
input,select,button{width:100%;padding:14px;border-radius:8px;font-size:16px}
input,select{background:#0b1220;color:white;border:1px solid #475569}
button{background:#4ade80;color:#052e16;font-weight:bold;border:0;margin-top:14px}
button:disabled{opacity:.5}
.horse{background:#162033;border:1px solid #334155;border-radius:12px;padding:16px;margin:12px 0}
.horse h3{color:#4ade80;margin-top:0}
.stat{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #334155}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#94a3b8}
</style>
</head>
<body>
<main>
<h1>RaceIQ</h1>
<p>Horse Racing Analytics</p>

<div class="panel">
<label>Private access password</label>
<input id="password" type="password" autocomplete="off" placeholder="Enter RaceIQ password">

<label>Race date</label>
<input id="date" type="date">

<button id="load">Load Race Cards</button>
<p id="status">Ready to connect.</p>

<label>Racetrack</label>
<select id="track"></select>

<label>Race</label>
<select id="race"></select>

<button id="horses">Load Horses</button>
</div>

<div id="details"></div>
<div id="results"></div>

<small>Source: SportStatsAPI. Data may be delayed. Historical speed figures and past performances are not yet connected.</small>
</main>

<script>
const API="https://raceiq-api.guidryjoseph890.workers.dev";
const el=id=>document.getElementById(id);
let races=[];

const today=new Date();
el("date").value=[
today.getFullYear(),
String(today.getMonth()+1).padStart(2,"0"),
String(today.getDate()).padStart(2,"0")
].join("-");

function status(message){
el("status").textContent=message;
}

async function request(path){
const password=el("password").value.trim();
if(!password)throw new Error("Enter your RaceIQ password.");

const response=await fetch(API+path,{
headers:{Authorization:"Bearer "+password}
});

const json=await response.json();

if(!response.ok || json.success===false){
throw new Error(
json.error?.message ||
JSON.stringify(json.error || json)
);
}

if(!Array.isArray(json.data)){
throw new Error("Unexpected API response: "+JSON.stringify(json));
}

return json.data;
}

function option(select,value,label){
const item=document.createElement("option");
item.value=value;
item.textContent=label;
select.appendChild(item);
}

function stat(parent,label,value){
const row=document.createElement("div");
row.className="stat";
const a=document.createElement("span");
const b=document.createElement("strong");
a.textContent=label;
b.textContent=value??"Unavailable";
row.append(a,b);
parent.appendChild(row);
}

function updateRaces(){
el("race").replaceChildren();
el("results").replaceChildren();
el("details").replaceChildren();

races.filter(r=>r.meeting?.name===el("track").value)
.forEach(r=>option(el("race"),r.code,r.race_name||r.code));
}

el("track").onchange=updateRaces;

el("load").onclick=async()=>{
el("load").disabled=true;
el("track").replaceChildren();
el("race").replaceChildren();
el("results").replaceChildren();
el("details").replaceChildren();

try{
status("Connecting to racing database...");
races=await request("/races?date="+encodeURIComponent(el("date").value));

const tracks=[...new Set(races.map(r=>r.meeting?.name).filter(Boolean))].sort();

tracks.forEach(t=>option(el("track"),t,t));
updateRaces();

status(races.length+" races retrieved across "+tracks.length+" tracks.");
}catch(e){
status("Error: "+e.message);
}finally{
el("load").disabled=false;
}
};

el("horses").onclick=async()=>{
const race=races.find(r=>r.code===el("race").value);
if(!race){status("Select a race first.");return;}

el("horses").disabled=true;
el("results").replaceChildren();
el("details").replaceChildren();

try{
status("Retrieving entered horses...");

const info=document.createElement("div");
info.className="panel";
stat(info,"Track",race.meeting?.name);
stat(info,"Race",race.race_name);
stat(info,"Distance",race.distance);
stat(info,"Surface",race.surface);
stat(info,"Purse",race.purse);
stat(info,"Class",race.race_type?.label);
el("details").appendChild(info);

const runners=await request("/races/"+encodeURIComponent(race.code)+"/runners");

runners.forEach(h=>{
const card=document.createElement("div");
card.className="horse";
const title=document.createElement("h3");
title.textContent="#"+(h.number??"?")+" "+(h.horse_name||"Unknown horse");
card.appendChild(title);

stat(card,"Status",h.status);
stat(card,"Jockey",h.jockey?.name);
stat(card,"Trainer",h.trainer?.name);
stat(card,"Weight",h.weight);
stat(card,"Morning line",h.morning_line?.fractional);
stat(card,"Decimal odds",h.morning_line?.decimal);
stat(card,"Last updated",h.updated_at);

el("results").appendChild(card);
});

status(runners.length+" horse entries retrieved.");
}catch(e){
status("Error: "+e.message);
}finally{
el("horses").disabled=false;
}
};
</script>
</body>
</html>

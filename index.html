<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>RaceIQ Free</title><style>body{background:#101722;color:#eaf0fa;font:16px system-ui;margin:0}main{max-width:520px;margin:auto;padding:28px 20px}h1{font-size:36px;margin:0}p{color:#aebed1;line-height:1.5}label{display:block;margin:20px 0 8px}input,select,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font:inherit;border:1px solid #45566e;background:#202c3c;color:white}button{background:#2864bd;border:0;font-weight:bold;margin-top:20px}small{color:#aebed1}section{background:#182333;padding:20px;border-radius:16px;margin-top:20px}textarea{width:100%;box-sizing:border-box;background:#202c3c;color:white;min-height:160px;border-radius:8px;padding:10px}</style><main><h1>RaceIQ</h1><p>Free • Racing research launcher</p><section><form id="f"><label for="date">Race date</label><input id="date" type="date" required><label for="track">Racetrack</label><input id="track" placeholder="e.g. Zia Park" required><label for="race">Race number</label><input id="race" type="number" min="1" max="30" value="1" required><label for="history">Historical races</label><select id="history"><option>10</option><option>5</option><option>20</option></select><button>Prepare research</button></form></section><section id="out" hidden><h2>Research request</h2><textarea id="prompt" readonly></textarea><button id="open">Open in ChatGPT</button><button id="copy">Copy request</button><p id="status" role="status"></p></section><p>Uses ChatGPT for public-source research. No live feed, paid API, or guaranteed data coverage. Research results appear in ChatGPT, not this launcher.</p></main><script>const $=id=>document.getElementById(id);let d=new Date();$('date').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('f').onsubmit=e=>{e.preventDefault();$('prompt').value=`Research ${$('track').value.trim()}, race ${$('race').value}, on ${$('date').value}. Use Equibase first and other reliable public sources for verification. Retrieve all entrants, scratches, timestamped odds, last ${$('history').value} pre-race finishes and speed ratings, class, surface, distance, pedigree, career records, jockey and trainer statistics. Organize by horse and create combined finishing-position and speed-rating graphs using comparable rating systems. Cite sources and identify missing data. Do not fabricate statistics or treat historical rates as predicted probabilities.`;$('out').hidden=false;};$('open').onclick=()=>location.href='https://chatgpt.com/?q='+encodeURIComponent($('prompt').value);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').value);$('status').textContent='Copied.'}catch(e){$('prompt').select();$('status').textContent='Select and copy the request manually.'}};</script></html>
